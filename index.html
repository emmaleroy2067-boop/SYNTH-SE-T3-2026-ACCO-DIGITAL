    if(!n) return "";
    const pc = 100*n/tot;
    return `<div class="seg" style="flex:0 0 ${pc}%;background:${p.couleur}"
      title="${n} RDV à ${p.val}/3 — ${p.libelle}">${mini?"":(pc>9?n:"")}</div>`;
  }).join("");
  return `<div class="bar${mini?" mini":""}">${segs}</div>`;
}
function barreLegende(pal){
  const tot = (pal["3"]||0)+(pal["2"]||0)+(pal["1"]||0) || 1;
  return `<div class="barleg">${Q.paliers.map(p=>{
    const n = pal[String(p.val)]||0;
    return `<span><i style="background:${p.couleur}"></i><b style="color:${p.couleur}">${p.val}/3 ${p.libelle}</b>
      · ${n} RDV · ${Math.round(100*n/tot)} % · ${p.desc}</span>`;
  }).join("")}</div>`;
}
function progression(pts){
  if(!pts || pts.length<2) return "";
  return `<span class="prog">${pts.map((p,i)=>{
    const [c] = qColor(p.qualif);
    return (i?'<span class="arw">›</span>':'')+`<i style="background:${c}" title="${jour(p.date)}">${p.qualif}</i>`;
  }).join("")}</span>`;
}

/* ---------- dossier client ---------- */
function dossier(d){
  const der = d.qualif_derniere!=null ? d.qualif_derniere : d.qualif_max;
  const [bc] = qColor(der);
  const recos = d.recos || [];
  const pills = d.rdvs.map((r,i)=>{ const[c,bg]=qColor(r.qualif);
    return `<span class="pill" style="color:${c};background:${bg};border-color:${c}33">
      ${d.rdvs.length>1?`RDV ${i+1} · `:""}${r.qualif!=null?r.qualif+"/3":"—"}
      <span style="color:#8a8a8a">${jour(r.date)}</span></span>`; }).join("");
  const issue = recos.length
    ? recos.map(r=>statutBadge(r.statut)).join("")
    : (d.a_relancer ? '<span class="badge b-rel">à relancer</span>'
                    : '<span class="badge b-nq">sans suite · non qualifié</span>');
  const maj = d.ecart ? '<span class="badge b-maj">MàJ pilotage</span>' : '';
  const syn = d.rdvs.filter(r=>r.synthese).map(r=>
    `<div class="syn">${d.rdvs.length>1?`<span class="d">${jour(r.date)}</span>`:""}${r.synthese}</div>`).join("");
  let biz = "";
  if(recos.length){
    biz = recos.map(r=>`<div class="biz">
      ${recos.length>1?`<span class="d" style="color:#7a7a7a">${jour(r.date)}</span>`:""}
      ${r.presta?`<span>${r.presta}</span>`:""}
      ${recos.length>1?statutBadge(r.statut):""}
      <span>CA potentiel <b>${eur(r.ca_potentiel)}</b></span>
      ${r.montant_signe?`<span>signé <b class="or">${eur(r.montant_signe)}</b></span>`:""}
      ${r.marge_eur?`<span>marge <b class="or">${eur(r.marge_eur)}</b></span>`:""}
      ${r.honoraires?`<span>honoraires <b>${eur(r.honoraires)}</b></span>`:""}
      ${r.etat_origine && r.etat_origine!==r.statut
        ? `<span class="muted" title="Le nouveau tableau n'a que 3 statuts : « En cours » y vaut « Envoyé »">nouveau tableau · « ${r.etat_origine} »</span>` : ""}
    </div>`).join("");
  } else if(d.a_relancer){
    biz = `<div class="biz"><span style="color:#e6cf5a">Aucune reco chiffrée au pilotage alors que le RDV était qualifié.</span></div>`;
  }
  return `<div class="dos" style="border-left-color:${bc}">
    <div class="dos-head"><span class="dos-nom">${T(d.client)}</span>
      <span class="rdvpills">${pills}</span>${issue}${maj}</div>
    ${syn}${biz}</div>`;
}
/* ---------- cartographie du commercial ---------- */
function frise(c){
  const pts = (c.progression||[]).filter(p=>p.date);
  if(pts.length<2) return "";
  const n = pts.length;
  const W=760,H=134,padL=34,padR=22,padT=18,padB=42;
  const iw=W-padL-padR, ih=H-padT-padB;
  /* pas de position par date reelle : plusieurs RDV tombent le meme jour et les
     etiquettes se chevauchent. On espace regulierement dans l'ordre chronologique. */
  const x = i => n===1 ? padL+iw/2 : padL + i*iw/(n-1);
  const y = v => padT + ih - ((v-1)/2)*ih;
  const grid = Q.paliers.map(p=>`<line x1="${padL}" y1="${y(p.val)}" x2="${W-padR}" y2="${y(p.val)}"
      stroke="#2a2a2a" stroke-width="1"/>
    <text x="${padL-9}" y="${y(p.val)+4}" fill="${p.couleur}" font-size="10" text-anchor="end">${p.val}</text>`).join("");
  const path = pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.qualif).toFixed(1)}`).join(" ");
  const large = n>6;
  const dots = pts.map((p,i)=>{const[c2]=qColor(p.qualif);
    const nom = T(p.client);
    const court = nom.length>14 ? nom.slice(0,13)+"…" : nom;
    return `<circle cx="${x(i).toFixed(1)}" cy="${y(p.qualif).toFixed(1)}" r="5"
        fill="${c2}" stroke="#1f1f1f" stroke-width="2"><title>${nom} — ${p.qualif}/3 le ${jour(p.date)}</title></circle>
      ${large?"":`<text x="${x(i).toFixed(1)}" y="${H-21}" fill="#c8c8c8" font-size="9.5"
        text-anchor="middle">${court}</text>`}
      <text x="${x(i).toFixed(1)}" y="${H-8}" fill="#7a7a7a" font-size="9.5"
        text-anchor="middle">${jour(p.date)}</text>`;}).join("");
  return `<div class="frisebox"><svg class="frise" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"
    role="img" aria-label="Qualification des RDV dans l'ordre chronologique">
    ${grid}<path d="${path}" fill="none" stroke="#F85A20" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg></div>`;
}
function cstat(l,v){ return `<div class="cstat"><div class="l">${l}</div><div class="v">${v}</div></div>`; }

/* ---------- carte commercial (repliee par defaut) ---------- */
function commercial(c,i,pid){
  const id = `com-${pid}-${i}`;
  const n3 = c.paliers["3"]||0;
  return `<div class="com" id="${id}">
    <button class="com-head" type="button" aria-expanded="false" aria-controls="${id}-b" data-com="${id}">
      <span class="chev">▶</span>
      <span class="com-nom">${T(c.nom)}</span>
      ${barre(c.paliers,true)}
      <span class="com-meta">
        <span>${c.nb_rdv} RDV · ${c.nb_dossiers} dossier${c.nb_dossiers>1?"s":""}${c.nb_recos?` · ${c.nb_recos} reco${c.nb_recos>1?"s":""}`:""}</span>
        <span>indice <b style="color:${moyColor(c.indice)}">${c.indice!=null?c.indice.toFixed(2):"—"}</b>/3</span>
        ${c.ca_signe?`<span>signé <b style="color:#F85A20">${eur(c.ca_signe)}</b></span>`:""}
        ${c.ca_attente?`<span>en attente <b>${eur(c.ca_attente)}</b></span>`:""}
        ${c.nb_a_relancer?`<span class="badge b-rel">${c.nb_a_relancer} à relancer</span>`:""}
      </span>
    </button>
    <div class="com-body" id="${id}-b" hidden>
      <div class="carto">
        ${cstat("RDV accompagnés",c.nb_rdv)}
        ${cstat("Dossiers",c.nb_dossiers)}
        ${cstat("Qualifiés 3/3",`<span style="color:#5dca8a">${n3}</span> <span style="font-size:12px;color:#8a8a8a">/ ${c.nb_rdv}</span>`)}
        ${cstat("Indice qualif.",`<span style="color:${moyColor(c.indice)}">${c.indice!=null?c.indice.toFixed(2):"—"}</span> <span style="font-size:12px;color:#8a8a8a">/3</span>`)}
        ${cstat("CA signé",`<span style="color:#F85A20">${eur(c.ca_signe)}</span>`)}
        ${cstat("CA en attente",eur(c.ca_attente))}
      </div>
      ${frise(c)}
      ${c.dossiers.map(dossier).join("")}
    </div>
  </div>`;
}

/* ---------- pages ---------- */
function kpisGlobaux(){
  let rdv=0,qs=[],signe=0,marge=0,hono=0,attente=0,nSig=0,nEnv=0;
  D.departements.forEach(d=>{
    rdv+=d.coaching.rdv.length;
    d.coaching.rdv.forEach(r=>{ if(r.qualif!=null) qs.push(r.qualif); });
    d.business.recos.forEach(r=>{
      if(r.statut==="Validé"){ signe+=r.montant_signe||0; marge+=r.marge_eur||0; hono+=r.honoraires||0; nSig++; }
      if(r.statut==="Envoyé"){ attente+=r.ca_potentiel||0; nEnv++; }
    });
  });
  const nq=qs.filter(v=>v===3).length;
  return {rdv,moy:moy(qs),signe,marge,hono,attente,nSig,nEnv,qs,nq,
          txq:qs.length?Math.round(100*nq/qs.length):0};
}
function flagsGlobaux(){
  let ec=0,rel=0,orph=0;
  D.departements.forEach(d=>{
    d.business.recos.forEach(r=>{ if(r.ecart) ec++; if(!r.a_rdv) orph++; });
    d.coaching.rdv.forEach(r=>{ if(r.a_relancer) rel++; });
  });
  return {ec,rel,orph};
}

function home(){
  const k=kpisGlobaux(), f=flagsGlobaux();
  return `<h2>Vue d'ensemble — ${D.departements.length} périmètres</h2>
  <div class="kgrid">
    ${kpiCard("RDV accompagnés",k.rdv)}
    ${kpiCard("RDV qualifiés 3/3",`<span style="color:#5dca8a">${k.nq}</span> <span style="font-size:14px;color:#8a8a8a">/ ${k.rdv}</span>`,"",k.txq+" % du flux")}
    ${kpiCard("Indice qualif.",`<span style="color:${moyColor(k.moy)}">${k.moy!=null?k.moy.toFixed(2):"—"}</span> <span style="font-size:14px;color:#8a8a8a">/3</span>`)}
    ${kpiCard("CA signé",eur(k.signe),"or",k.nSig+" reco(s)")}
    ${kpiCard("Marge dégagée",eur(k.marge),"or")}
    ${kpiCard("CA en attente",eur(k.attente),"",k.nEnv+" envoyé(s)")}
  </div>
  ${barre(paliersDe(k.qs))}${barreLegende(paliersDe(k.qs))}
  ${encart("Lecture du trimestre", D.synthese_globale)}
  <h3>Signaux de réconciliation</h3>
  <div class="flags">
    <div class="flag ec"><div class="n">${f.ec}</div><div class="t">écart(s) Airtable / pilotage<br>→ badge « MàJ pilotage »</div></div>
    <div class="flag re"><div class="n">${f.rel}</div><div class="t">RDV qualifié(s) 2/3-3/3 sans reco chiffrée<br>→ manque à gagner, à relancer</div></div>
    <div class="flag or2"><div class="n">${f.orph}</div><div class="t">reco(s) sans RDV accompagné<br>→ accompagnement non tracé</div></div>
  </div>
  <h3>Pipeline par périmètre</h3>
  <div class="tscroll"><table><thead><tr><th>Périmètre</th><th>RDV</th><th style="min-width:170px">Qualification</th><th>Indice /3</th><th>Signé</th><th>En attente</th><th>À relancer</th></tr></thead><tbody>
  ${D.departements.map(d=>{
    const rdv=d.coaching.rdv, recos=d.business.recos;
    const qq=rdv.filter(r=>r.qualif!=null).map(r=>r.qualif);
    const m=moy(qq);
    const sig=recos.filter(r=>r.statut==="Validé");
    const ca=sig.reduce((a,r)=>a+(r.montant_signe||0),0);
    const att=recos.filter(r=>r.statut==="Envoyé").reduce((a,r)=>a+(r.ca_potentiel||0),0);
    const rel=rdv.filter(r=>r.a_relancer).length;
    return `<tr><td class="cli">${d.libelle}</td><td>${rdv.length}</td>
      <td>${barre(paliersDe(qq),true)}</td>
      <td><span style="color:${moyColor(m)}">${m!=null?m.toFixed(2):"—"}</span></td>
      <td>${eur(ca)}</td><td>${eur(att)}</td>
      <td>${rel?`<span class="badge b-rel">${rel}</span>`:'<span class="muted">—</span>'}</td></tr>`;
  }).join("")}
  </tbody></table></div>`;
}

function dept(d){
  const rdv=d.coaching.rdv, recos=d.business.recos;
  const qs=rdv.filter(r=>r.qualif!=null).map(r=>r.qualif);
  const m=moy(qs);
  const sig=recos.filter(r=>r.statut==="Validé");
  const ca=sig.reduce((a,r)=>a+(r.montant_signe||0),0);
  const mg=sig.reduce((a,r)=>a+(r.marge_eur||0),0);
  const att=recos.filter(r=>r.statut==="Envoyé").reduce((a,r)=>a+(r.ca_potentiel||0),0);
  const coms = d.commerciaux||[];
  const orph = d.recos_orphelines||[];
  return `<h2>${d.libelle} <span class="muted">· ${d.zone}</span></h2>
  <div class="kgrid">
    ${kpiCard("RDV accompagnés",rdv.length,"",coms.length+" commercial(aux)")}
    ${kpiCard("RDV qualifiés 3/3",`<span style="color:#5dca8a">${qs.filter(v=>v===3).length}</span> <span style="font-size:14px;color:#8a8a8a">/ ${rdv.length}</span>`)}
    ${kpiCard("Indice qualif.",`<span style="color:${moyColor(m)}">${m!=null?m.toFixed(2):"—"}</span> <span style="font-size:14px;color:#8a8a8a">/3</span>`)}
    ${kpiCard("CA signé",eur(ca),"or",mg?"marge "+eur(mg):"")}
    ${kpiCard("CA en attente",eur(att))}
  </div>
  ${qs.length?barre(paliersDe(qs))+barreLegende(paliersDe(qs)):""}
  ${encart("Lecture du périmètre", d.synthese)}
  <h3>Pipeline par commercial et par dossier</h3>
  ${coms.length?`<div class="depli"><button type="button" id="ev-toggle-all">Tout déplier</button></div>`
    +coms.map((c,i)=>commercial(c,i,d.id)).join("")
    :'<p class="muted">Aucun RDV accompagné sur la période.</p>'}
  ${orph.length?`<h3>Recos sans RDV accompagné</h3>
    <p class="muted">Présentes au pilotage sur ce périmètre, sans RDV correspondant dans Airtable : accompagnement non tracé.</p>
    <div class="tscroll"><table><thead><tr><th>Client</th><th>Commercial</th><th>Statut</th><th>CA pot.</th><th>Signé</th></tr></thead><tbody>
    ${orph.map(r=>`<tr><td class="cli">${T(r.client)}</td><td>${T(r.commercial||'')}</td>
      <td>${statutBadge(r.statut)}</td><td>${eur(r.ca_potentiel)}</td><td>${eur(r.montant_signe)}</td></tr>`).join("")}
    </tbody></table></div>`:""}`;
}

function courbe(){
  const pts = D.courbe_annee || [];
  if(pts.length<1) return "";
  const W=760,H=150,padL=38,padR=18,padT=16,padB=32;
  const iw=W-padL-padR, ih=H-padT-padB;
  const x = i => pts.length===1 ? padL+iw/2 : padL + i*iw/(pts.length-1);
  const y = v => padT + ih - ((v-1)/2)*ih;
  const line = pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.moyenne).toFixed(1)}`).join(" ");
  const grid = [1,2,3].map(v=>`<line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}"
      stroke="#2a2a2a" stroke-width="1"/><text x="${padL-10}" y="${y(v)+4}" fill="#7a7a7a"
      font-size="10" text-anchor="end">${v}</text>`).join("");
  const dots = pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.moyenne).toFixed(1)}" r="4.5"
      fill="${moyColor(p.moyenne)}" stroke="#1f1f1f" stroke-width="2"/>
    <text x="${x(i).toFixed(1)}" y="${(y(p.moyenne)-11).toFixed(1)}" fill="#EDEDED" font-size="11"
      text-anchor="middle">${p.moyenne.toFixed(2)}</text>
    <text x="${x(i).toFixed(1)}" y="${H-10}" fill="#9a9a9a" font-size="10.5"
      text-anchor="middle">${p.periode} · ${p.nb_rdv} RDV</text>`).join("");
  return `<div class="curvebox"><svg class="curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"
    role="img" aria-label="Qualification moyenne sur 3 par trimestre">
    ${grid}<path d="${line}" fill="none" stroke="#F85A20" stroke-width="2.2"
      stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg></div>`;
}

function annee(){
  const A = D.annee || [];
  const CV = D.meta.couverture_pilotage || {};
  const tot = A.reduce((a,t)=>({rdv:a.rdv+t.nb_rdv, q:a.q+t.nb_qualifies,
    ca:a.ca+t.ca_signe, mg:a.mg+t.marge, att:a.att+t.ca_attente, rec:a.rec+t.nb_recos}),
    {rdv:0,q:0,ca:0,mg:0,att:0,rec:0});
  const src = s => s==="ancien" ? "ancien tableau" : "nouveau tableau";
  return `<h2>Vue annuelle — cumul ${A.length} trimestre(s)</h2>
  <div class="expl"><span class="lab">Périmètre des sources</span>Depuis la bascule du
  ${CV.bascule||"2026-10-01"}${CV.ancien_actif===false?" (effective)":" (pas encore atteinte)"},
  <b>l'ancien tableau n'apporte plus de nouvelles lignes</b> : seules les recos issues d'une
  journée d'accompagnement cochée dans le nouveau tableau entrent désormais dans le suivi.
  Ses lignes historiques sont conservées, sans quoi des dossiers déjà chiffrés perdraient
  leur issue business.</div>
  <div class="kgrid">
    ${kpiCard("RDV accompagnés",tot.rdv)}
    ${kpiCard("RDV qualifiés 3/3",`<span style="color:#5dca8a">${tot.q}</span> <span style="font-size:14px;color:#8a8a8a">/ ${tot.rdv}</span>`)}
    ${kpiCard("CA signé cumulé",eur(tot.ca),"or",tot.rec+" reco(s)")}
    ${kpiCard("Marge cumulée",eur(tot.mg),"or")}
    ${kpiCard("CA en attente",eur(tot.att))}
  </div>
  <h3>Indice de qualification digitale /3</h3>
  ${courbe()}
  <h3>Détail par trimestre</h3>
  <div class="tscroll"><table><thead><tr><th>Trimestre</th><th>RDV</th><th>Qualifiés 3/3</th>
    <th>Indice /3</th><th>Recos</th><th>Signé</th><th>Marge</th><th>En attente</th><th>Source pilotage</th></tr></thead><tbody>
  ${A.map(t=>`<tr><td class="cli">${t.periode}</td><td>${t.nb_rdv}</td>
    <td><span style="color:#5dca8a">${t.nb_qualifies}</span></td>
    <td><span style="color:${moyColor(t.moyenne)}">${t.moyenne!=null?t.moyenne.toFixed(2):"—"}</span></td>
    <td>${t.nb_recos||"—"}</td><td>${eur(t.ca_signe)}</td><td>${eur(t.marge)}</td><td>${eur(t.ca_attente)}</td>
    <td><span class="muted">${t.sources.length?t.sources.map(src).join(" + "):"—"}</span></td></tr>`).join("")}
  </tbody></table></div>`;
}

const pages=[{id:"home",lib:"Accueil"},{id:"annee",lib:"Vue annuelle"}].concat(D.departements.map(d=>({id:d.id,lib:d.libelle})));
function go(id){
  document.querySelectorAll("#ev-nav button").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
  const body=document.getElementById("ev-body");
  body.innerHTML = id==="home" ? home()
    : id==="annee" ? annee()
    : dept(D.departements.find(d=>d.id===id));
  brancher();
}
function ouvrir(carte, ouvert){
  const head = carte.querySelector(".com-head");
  const corps = carte.querySelector(".com-body");
  carte.classList.toggle("open", ouvert);
  head.setAttribute("aria-expanded", ouvert ? "true" : "false");
  corps.hidden = !ouvert;
}
function brancher(){
  document.querySelectorAll("#ev-body .com-head").forEach(h=>{
    h.onclick = () => {
      const carte = h.closest(".com");
      ouvrir(carte, carte.querySelector(".com-body").hidden);
    };
  });
  const all = document.getElementById("ev-toggle-all");
  if(all) all.onclick = () => {
    const cartes = [...document.querySelectorAll("#ev-body .com")];
    const tout = cartes.every(c=>c.classList.contains("open"));
    cartes.forEach(c=>ouvrir(c, !tout));
    all.textContent = tout ? "Tout déplier" : "Tout replier";
  };
}
document.getElementById("ev-per").innerHTML=D.meta.periode+"<br><b>"+D.meta.indicateur+"</b>";
document.getElementById("ev-gen").textContent="généré le "+D.meta.genere_le;
const CV=D.meta.couverture_pilotage||{};
document.getElementById("ev-src").textContent=
  `pilotage trimestriel : ${CV.ancien||0} ligne(s) ancien tableau + ${CV.nouveau||0} nouveau`
  + (CV.ancien_actif===false ? ` · ancien tableau figé au ${CV.bascule||"2026-10-01"}, historique conservé` : "");
const nav=document.getElementById("ev-nav");
nav.innerHTML=pages.map(p=>`<button data-id="${p.id}">${p.lib}</button>`).join("");
nav.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.id));
go("home");
</script></body></html>
